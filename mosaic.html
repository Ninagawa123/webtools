<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Mosaic Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .drop-zone {
            border: 2px dashed #4a4a6a;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 25px;
        }

        .drop-zone:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }

        .drop-zone.dragover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            transform: scale(1.02);
        }

        .drop-zone.has-file {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.05);
        }

        .drop-zone-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .drop-zone-text {
            font-size: 1rem;
            color: #888;
        }

        .drop-zone-filename {
            font-size: 0.9rem;
            color: #4ade80;
            margin-top: 10px;
            word-break: break-all;
        }

        .settings-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .settings-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .settings-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .settings-label {
            min-width: 140px;
            font-size: 0.95rem;
        }

        input[type="range"] {
            flex: 1;
            min-width: 200px;
            height: 8px;
            background: #2a2a4a;
            border-radius: 4px;
            cursor: pointer;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border-radius: 50%;
            cursor: pointer;
        }

        .value-display {
            min-width: 60px;
            font-size: 0.95rem;
            color: #00d4ff;
            font-weight: 600;
        }

        .preview-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .preview-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .preview-box {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }

        .preview-label {
            text-align: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #888;
        }

        .preview-canvas-wrapper {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
        }

        canvas {
            max-width: 100%;
            max-height: 400px;
            display: block;
        }

        .placeholder {
            color: #555;
            font-size: 0.9rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid #4a4a6a;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00d4ff;
        }

        .btn-download {
            background: linear-gradient(135deg, #7b2cbf, #5a189a);
            color: #fff;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(123, 44, 191, 0.4);
        }

        .btn:disabled {
            background: #4a4a6a;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            border-color: #4a4a6a;
        }

        input[type="file"] {
            display: none;
        }

        .tip {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #666;
        }

        @media (max-width: 600px) {
            .preview-container {
                flex-direction: column;
            }

            .preview-box {
                max-width: 100%;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔲 Image Mosaic Tool</h1>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">🖼️</div>
            <div class="drop-zone-text">画像をドロップ、またはクリックして選択<br>(PNG, JPG, GIF, WebP)</div>
            <div class="drop-zone-filename" id="fileName"></div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="settings-section">
            <div class="settings-title">⚙️ モザイク設定</div>
            <div class="settings-row">
                <span class="settings-label">モザイク強度:</span>
                <input type="range" id="mosaicSize" min="2" max="50" value="10">
                <span class="value-display" id="sizeDisplay">10px</span>
            </div>
            <div class="settings-row">
                <span class="settings-label" style="color: #888; font-size: 0.85rem;">※ 値が大きいほど粗いモザイクになります</span>
            </div>
        </div>

        <div class="preview-section">
            <div class="preview-container">
                <div class="preview-box">
                    <div class="preview-label">元画像</div>
                    <div class="preview-canvas-wrapper">
                        <canvas id="originalCanvas"></canvas>
                        <span class="placeholder" id="originalPlaceholder">画像がアップロードされていません</span>
                    </div>
                </div>
                <div class="preview-box">
                    <div class="preview-label">モザイク適用後</div>
                    <div class="preview-canvas-wrapper">
                        <canvas id="mosaicCanvas"></canvas>
                        <span class="placeholder" id="mosaicPlaceholder">画像がアップロードされていません</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-reset" id="resetBtn" disabled>↺ リセット</button>
            <button class="btn btn-download" id="downloadBtn" disabled>⬇ ダウンロード</button>
        </div>
        <br>
    </div>

    <script>
        // State
        let originalImage = null;
        let originalFileName = '';

        // DOM Elements
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const mosaicSize = document.getElementById('mosaicSize');
        const sizeDisplay = document.getElementById('sizeDisplay');
        const originalCanvas = document.getElementById('originalCanvas');
        const mosaicCanvas = document.getElementById('mosaicCanvas');
        const originalPlaceholder = document.getElementById('originalPlaceholder');
        const mosaicPlaceholder = document.getElementById('mosaicPlaceholder');
        const resetBtn = document.getElementById('resetBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        const originalCtx = originalCanvas.getContext('2d');
        const mosaicCtx = mosaicCanvas.getContext('2d');

        // Setup drop zone
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // Handle file
        function handleFile(file) {
            originalFileName = file.name.replace(/\.[^/.]+$/, '');
            fileName.textContent = file.name;
            dropZone.classList.add('has-file');

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    drawOriginal();
                    applyMosaic();
                    updateButtons(true);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Draw original image
        function drawOriginal() {
            if (!originalImage) return;

            originalCanvas.width = originalImage.width;
            originalCanvas.height = originalImage.height;
            originalCtx.drawImage(originalImage, 0, 0);

            originalCanvas.style.display = 'block';
            originalPlaceholder.style.display = 'none';
        }

        // Apply mosaic effect
        function applyMosaic() {
            if (!originalImage) return;

            const blockSize = parseInt(mosaicSize.value);
            const width = originalImage.width;
            const height = originalImage.height;

            mosaicCanvas.width = width;
            mosaicCanvas.height = height;

            // Draw original first
            mosaicCtx.drawImage(originalImage, 0, 0);

            // Get image data
            const imageData = mosaicCtx.getImageData(0, 0, width, height);
            const data = imageData.data;

            // Apply mosaic
            for (let y = 0; y < height; y += blockSize) {
                for (let x = 0; x < width; x += blockSize) {
                    // Calculate average color for block
                    let r = 0, g = 0, b = 0, a = 0;
                    let count = 0;

                    const blockWidth = Math.min(blockSize, width - x);
                    const blockHeight = Math.min(blockSize, height - y);

                    for (let by = 0; by < blockHeight; by++) {
                        for (let bx = 0; bx < blockWidth; bx++) {
                            const idx = ((y + by) * width + (x + bx)) * 4;
                            r += data[idx];
                            g += data[idx + 1];
                            b += data[idx + 2];
                            a += data[idx + 3];
                            count++;
                        }
                    }

                    r = Math.round(r / count);
                    g = Math.round(g / count);
                    b = Math.round(b / count);
                    a = Math.round(a / count);

                    // Fill block with average color
                    for (let by = 0; by < blockHeight; by++) {
                        for (let bx = 0; bx < blockWidth; bx++) {
                            const idx = ((y + by) * width + (x + bx)) * 4;
                            data[idx] = r;
                            data[idx + 1] = g;
                            data[idx + 2] = b;
                            data[idx + 3] = a;
                        }
                    }
                }
            }

            mosaicCtx.putImageData(imageData, 0, 0);

            mosaicCanvas.style.display = 'block';
            mosaicPlaceholder.style.display = 'none';
        }

        // Update mosaic on slider change
        mosaicSize.addEventListener('input', () => {
            sizeDisplay.textContent = mosaicSize.value + 'px';
            if (originalImage) {
                applyMosaic();
            }
        });

        // Update buttons
        function updateButtons(enabled) {
            resetBtn.disabled = !enabled;
            downloadBtn.disabled = !enabled;
        }

        // Reset
        resetBtn.addEventListener('click', () => {
            originalImage = null;
            originalFileName = '';
            fileName.textContent = '';
            dropZone.classList.remove('has-file');
            fileInput.value = '';

            originalCanvas.style.display = 'none';
            mosaicCanvas.style.display = 'none';
            originalPlaceholder.style.display = 'block';
            mosaicPlaceholder.style.display = 'block';

            mosaicSize.value = 10;
            sizeDisplay.textContent = '10px';

            updateButtons(false);
        });

        // Download
        downloadBtn.addEventListener('click', () => {
            if (!originalImage) return;

            const link = document.createElement('a');
            link.download = `${originalFileName}_mosaic.png`;
            link.href = mosaicCanvas.toDataURL('image/png');
            link.click();
        });

        // Initial state
        originalCanvas.style.display = 'none';
        mosaicCanvas.style.display = 'none';
    </script>
</body>
</html>
